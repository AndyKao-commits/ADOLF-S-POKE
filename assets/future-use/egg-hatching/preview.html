<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>四級幸運蛋共用孵化動畫</title>
<style>body{background:#172839;color:#eef6ff;margin:24px;font:16px/1.7 system-ui}main{max-width:800px;margin:auto}button{padding:10px 16px;margin:4px;font:inherit;border:2px solid #7598b7;background:#243c58;color:white;border-radius:8px}button[aria-pressed=true]{border-color:#ffcc50}button:disabled{opacity:.5}canvas{width:100%;height:auto;background:#294637;image-rendering:pixelated}a{color:#a4ddff}</style>
<main><h1>幸運蛋孵化預覽</h1><p>普通 → 稀有 → 傳說 → 史詩。預覽結果統一使用卡比獸，僅展示動畫，不代表獎勵池。</p><div id="tiers"><button data-tier="common" aria-pressed="true">普通・紅白</button><button data-tier="rare" aria-pressed="false">稀有・藍紅</button><button data-tier="legendary" aria-pressed="false">傳說・黑金</button><button data-tier="epic" aria-pressed="false">史詩・紫粉</button></div><p><label><input id="reduced" type="checkbox">減少動態</label></p><button id="play" disabled>開始孵化</button><button id="skip" disabled>跳過動畫</button><p id="status" role="status">正在載入四款蛋圖與範例角色…</p><canvas id="view" width="720" height="360" aria-label="孵化動畫展示區"></canvas><p><a href="README.md">執行與接入規則</a></p></main>
<script src="egg-hatching.js"></script><script>
const ctx=document.getElementById('view').getContext('2d'),play=document.getElementById('play'),skip=document.getElementById('skip'),status=document.getElementById('status'),reduced=document.getElementById('reduced');
reduced.checked=matchMedia('(prefers-reduced-motion: reduce)').matches;
let tier='common',ready=false,last=null;const eggs={};const result=new Image();
function load(img,url){return new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=()=>reject(Error(url));img.src=url;});}
Promise.all([...Object.keys(EggHatching.tiers).map(key=>{eggs[key]=new Image();return load(eggs[key],'../lucky-eggs/lucky-egg-'+key+'.png');}),load(result,'../../pokemon/143/Idle.png')]).then(()=>{ready=true;play.disabled=false;status.textContent='選擇蛋的等級，再開始孵化。';}).catch(()=>{status.textContent='素材載入失敗，請從專案根目錄啟動 HTTP 預覽。';});
const animation=EggHatching.create({onComplete:()=>{play.disabled=false;skip.disabled=true;status.textContent='動畫完成（範例結果，不會發放獎勵）。';}});
document.querySelectorAll('[data-tier]').forEach(button=>button.onclick=()=>{if(animation.state().active)return;tier=button.dataset.tier;animation.cancel();document.querySelectorAll('[data-tier]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));status.textContent='已選擇 '+button.textContent;});
play.onclick=()=>{if(!ready)return;if(animation.start({tier,reducedMotion:reduced.checked})){play.disabled=true;skip.disabled=false;status.textContent='孵化中…';last=null;}};skip.onclick=()=>animation.skip();
function frame(now){const dt=last===null?0:(now-last)/1000;last=now;animation.update(dt);ctx.clearRect(0,0,720,360);ctx.imageSmoothingEnabled=false;
if(ready){if(animation.state().phase==='idle')ctx.drawImage(eggs[tier],300,108,120,144);else animation.draw(ctx,{x:360,y:180,scale:3,eggImage:eggs[animation.state().tier],drawResult:(c,x,y)=>c.drawImage(result,0,0,32,64,x-15.5*3,y-35.5*3+35,96,192)});}requestAnimationFrame(frame);}requestAnimationFrame(frame);
document.addEventListener('visibilitychange',()=>{last=null;});
</script></html>
